<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>404 - Page Not Found</title>
<link href="{{ url_for('static', filename='favicon.ico') }}" rel="icon" type="image/x-icon"/>
<style>
   * {
      box-sizing: border-box;
   }
   body {
      background-color: #1e1e1e;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
   }
   .error-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
   }
   .error-code {
      font-size: 80px;
      font-weight: 700;
      color: #04AA6D;
      margin: 0;
      line-height: 1;
   }
   h1 {
      font-weight: 600;
      letter-spacing: -0.3px;
      margin: 12px 0 8px 0;
   }
   p {
      color: #bbb;
      font-size: 14px;
      margin: 0 0 24px 0;
   }
   button {
      background-color: #04AA6D;
      color: #fff;
      border: none;
      padding: 10px 18px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
   }
   button:hover {
      background-color: #038a57;
      box-shadow: 0 4px 12px rgba(4, 170, 109, 0.3);
   }
   button:active {
      transform: scale(0.98);
   }
   footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 12px;
   }
   footer a {
      color: #04AA6D;
      text-decoration: none;
   }
   footer a:hover {
      text-decoration: underline;
   }
</style>
</head>
<body>
<div class="error-content">
<p class="error-code">404</p>
<h1>Page Not Found</h1>
<p>The page you're looking for doesn't exist or has been moved.</p>
<button onclick="location.href='{{ url_for('index') }}'">Go back to the homepage</button>
</div>
<footer>
<p>Pokémon and All Respective Names are Trademark &amp; © of Nintendo 1996-2024</p>
</footer>
</body>
</html>
